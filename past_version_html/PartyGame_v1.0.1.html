<!doctype html>
<!--
App Name: PartyGame
Version: v1.0.1
Update Theme: 版本管理规范化 + 首页文案更新 + 实时时间显示 + 单人/团体赛命名逻辑修正 + 头像库扩展 + 代码结构整理
Updated File: PartyGame_v1.0.1.html
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聚会Party小游戏合集</title>
  <style>
    :root {
      --cream: #fff8ea;
      --cream-2: #fff1d8;
      --milk: #fffdf8;
      --ink: #594253;
      --muted: #8d7684;
      --pink: #ff9fb9;
      --blush: #ffd8df;
      --peach: #ffc09b;
      --butter: #ffe58d;
      --mint: #aee8cc;
      --sky: #a9dcff;
      --lavender: #cfc2ff;
      --rose: #ff719d;
      --shadow: 0 18px 42px rgba(130, 91, 82, 0.16);
      --shadow-soft: 0 10px 24px rgba(130, 91, 82, 0.11);
      --ring: 0 0 0 4px rgba(255, 159, 185, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 229, 141, 0.72) 0 90px, transparent 92px),
        radial-gradient(circle at 90% 8%, rgba(207, 194, 255, 0.56) 0 120px, transparent 122px),
        radial-gradient(circle at 80% 90%, rgba(174, 232, 204, 0.52) 0 140px, transparent 142px),
        linear-gradient(135deg, #fff8ea 0%, #fff1f4 47%, #f3fbff 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255, 159, 185, 0.33) 0 2px, transparent 2.5px),
        radial-gradient(circle, rgba(169, 220, 255, 0.3) 0 2px, transparent 2.5px);
      background-position: 20px 30px, 95px 110px;
      background-size: 150px 150px, 180px 180px;
      opacity: 0.8;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none !important;
      box-shadow: none !important;
    }

    .app {
      position: relative;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--pink), var(--butter));
      box-shadow: var(--shadow-soft);
    }

    .clock {
      min-width: 230px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .ghost-btn,
    .primary-btn,
    .pill-btn,
    .score-btn,
    .icon-btn {
      border-radius: 999px;
      color: var(--ink);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .ghost-btn {
      padding: 11px 18px;
      border: 2px solid rgba(255, 159, 185, 0.38);
      background: rgba(255, 253, 248, 0.76);
      box-shadow: var(--shadow-soft);
    }

    .primary-btn {
      min-height: 52px;
      padding: 14px 24px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--rose), var(--peach) 56%, var(--butter));
      box-shadow: 0 12px 26px rgba(255, 113, 157, 0.26);
    }

    .ghost-btn:hover,
    .primary-btn:hover,
    .pill-btn:hover,
    .score-btn:hover,
    .icon-btn:hover,
    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .ghost-btn:focus-visible,
    .primary-btn:focus-visible,
    .pill-btn:focus-visible,
    .score-btn:focus-visible,
    .icon-btn:focus-visible,
    .game-card:focus-visible,
    input:focus-visible {
      outline: none;
      box-shadow: var(--shadow), var(--ring);
    }

    .screen {
      display: none;
      animation: popIn 280ms ease both;
    }

    .screen.active {
      display: block;
    }

    .hero-card {
      position: relative;
      min-height: 310px;
      padding: clamp(28px, 5vw, 58px);
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.88);
      border-radius: 36px;
      background:
        linear-gradient(135deg, rgba(255, 253, 248, 0.94), rgba(255, 241, 216, 0.9)),
        radial-gradient(circle at 88% 26%, rgba(169, 220, 255, 0.46), transparent 30%);
      box-shadow: var(--shadow);
    }

    .hero-card h1 {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0;
      font-size: clamp(40px, 7vw, 76px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .hero-card p {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.7;
    }

    .decor {
      position: absolute;
      z-index: 0;
      display: grid;
      place-items: center;
      user-select: none;
      animation: floaty 4s ease-in-out infinite;
    }

    .star {
      width: 34px;
      height: 34px;
      background: var(--butter);
      clip-path: polygon(50% 0, 61% 34%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 34%);
      filter: drop-shadow(0 6px 8px rgba(245, 181, 69, 0.18));
    }

    .sparkle {
      color: var(--rose);
      font-size: 28px;
      font-weight: 900;
    }

    .ribbon {
      width: 74px;
      height: 26px;
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, var(--pink) 0 14px, var(--milk) 14px 26px);
      box-shadow: var(--shadow-soft);
      transform: rotate(-16deg);
    }

    .candy {
      width: 62px;
      height: 34px;
      border: 3px solid #fff;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--mint), var(--sky));
      box-shadow: var(--shadow-soft);
      transform: rotate(12deg);
    }

    .games-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1.5fr) repeat(2, minmax(190px, 0.85fr));
      gap: 18px;
      margin-top: 22px;
    }

    .game-card {
      position: relative;
      min-height: 176px;
      padding: 24px;
      overflow: hidden;
      text-align: left;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 253, 248, 0.86);
      box-shadow: var(--shadow-soft);
      transition: transform 170ms ease, box-shadow 170ms ease;
    }

    .game-card.main {
      min-height: 230px;
      background:
        radial-gradient(circle at 88% 10%, rgba(255, 229, 141, 0.72), transparent 28%),
        linear-gradient(135deg, #fffdf8, #ffe5ed 58%, #e7f7ff);
    }

    .game-card h2,
    .game-card h3 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }

    .game-card h3 {
      font-size: 22px;
    }

    .game-card p {
      position: relative;
      z-index: 1;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .tag {
      position: relative;
      z-index: 1;
      display: inline-flex;
      margin-top: 18px;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      background: var(--butter);
      box-shadow: 0 8px 16px rgba(245, 181, 69, 0.18);
    }

    .placeholder {
      opacity: 0.8;
      cursor: default;
    }

    .panel {
      padding: clamp(20px, 3.5vw, 34px);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      background: rgba(255, 253, 248, 0.88);
      box-shadow: var(--shadow);
    }

    .section-title {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 48px);
      letter-spacing: 0;
    }

    .section-subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.65;
    }

    .mode-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .pill-btn {
      min-height: 120px;
      padding: 20px;
      border: 3px solid transparent;
      background: linear-gradient(135deg, #fffdf8, #fff2dc);
      box-shadow: var(--shadow-soft);
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 900;
    }

    .pill-btn.selected,
    .avatar-card.selected {
      border-color: var(--rose);
      background: linear-gradient(135deg, #fffdf8, #ffe1ec);
      box-shadow: var(--shadow), var(--ring);
    }

    .setup-grid {
      display: grid;
      grid-template-columns: 0.88fr 1.12fr;
      gap: 22px;
      align-items: start;
    }

    .field {
      display: grid;
      gap: 9px;
      margin-bottom: 18px;
      font-weight: 900;
    }

    .field input {
      width: 100%;
      min-height: 54px;
      padding: 0 18px;
      border: 3px solid #ffe1c8;
      border-radius: 18px;
      color: var(--ink);
      background: #fffdf8;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.8);
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .avatar-card {
      display: grid;
      min-height: 82px;
      place-items: center;
      border: 3px solid transparent;
      border-radius: 22px;
      background: linear-gradient(135deg, #fffdf8, #f2fbff);
      box-shadow: var(--shadow-soft);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .avatar-card:hover {
      transform: translateY(-3px) rotate(-1deg);
      box-shadow: var(--shadow);
    }

    .avatar-face {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border-radius: 50%;
      box-shadow: inset 0 -5px 0 rgba(255, 113, 157, 0.13), 0 8px 14px rgba(130, 91, 82, 0.11);
      font-size: 28px;
    }

    .participant-list,
    .scoreboard {
      display: grid;
      gap: 10px;
    }

    .participant-row,
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      padding: 9px 12px;
      border-radius: 18px;
      background: rgba(255, 248, 234, 0.76);
    }

    .participant-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-weight: 900;
    }

    .mini-avatar {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: #ffe1ec;
    }

    .mini-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffe1ec;
      color: var(--rose);
      font-weight: 900;
    }

    .error-message {
      display: none;
      margin: 14px 0 0;
      padding: 12px 14px;
      border: 2px solid rgba(255, 113, 157, 0.45);
      border-radius: 18px;
      color: #9f3658;
      background: #fff0f5;
      box-shadow: var(--shadow-soft);
      font-weight: 900;
    }

    .error-message.show {
      display: block;
      animation: popIn 180ms ease both;
    }

    .gameplay-grid {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 290px;
      gap: 18px;
      align-items: start;
    }

    .side-panel {
      padding: 18px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 253, 248, 0.9);
      box-shadow: var(--shadow-soft);
    }

    .side-panel h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .score-row.active {
      background: linear-gradient(135deg, #fff3b8, #ffe1ec);
      box-shadow: var(--ring);
    }

    .score-value {
      font-size: 22px;
      font-weight: 900;
    }

    .score-actions {
      display: flex;
      gap: 6px;
    }

    .score-btn,
    .icon-btn {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      background: #fff1d8;
      color: var(--ink);
      font-weight: 900;
    }

    .media-card {
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.92);
      border-radius: 34px;
      background: #2d2530;
      box-shadow: var(--shadow);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #2d2530;
    }

    .media-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #fffdf8, #fff1d8);
    }

    .question-label {
      min-width: 0;
      font-weight: 900;
    }

    .question-label span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .host-controls {
      display: grid;
      gap: 10px;
    }

    .answer-panel {
      margin-top: 12px;
      padding: 16px;
      border: 2px dashed rgba(255, 113, 157, 0.42);
      border-radius: 24px;
      background: #fff8ea;
    }

    .answer-panel h3 {
      margin: 0 0 8px;
    }

    .answer-panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 5;
      max-width: min(360px, calc(100% - 44px));
      padding: 13px 16px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      background: #fffdf8;
      box-shadow: var(--shadow);
      transform: translateY(24px);
      opacity: 0;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @keyframes popIn {
      from {
        transform: translateY(10px) scale(0.99);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes floaty {
      0%,
      100% {
        transform: translateY(0) rotate(var(--rot, 0deg));
      }
      50% {
        transform: translateY(-10px) rotate(var(--rot, 0deg));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }

    @media (max-width: 980px) {
      .games-grid,
      .setup-grid,
      .gameplay-grid {
        grid-template-columns: 1fr;
      }

      .gameplay-grid .side-panel:first-child {
        order: 2;
      }

      .gameplay-grid .media-wrap {
        order: 1;
      }

      .gameplay-grid .side-panel:last-child {
        order: 3;
      }
    }

    @media (max-width: 740px) {
      .avatar-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 20px, 1180px);
        padding-top: 14px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .clock {
        min-width: 0;
      }

      .hero-card {
        border-radius: 28px;
      }

      .mode-row {
        grid-template-columns: 1fr;
      }

      .media-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="topbar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <span class="clock" id="clock">0000年0月0日，00:00:00</span>
      </div>
      <button class="ghost-btn" type="button" data-nav="home">回到首页</button>
    </nav>

    <section class="screen active" id="home">
      <div class="hero-card">
        <div class="decor star" style="right: 12%; top: 18%; --rot: 14deg;"></div>
        <div class="decor sparkle" style="right: 28%; bottom: 16%; --rot: -8deg;">✧</div>
        <div class="decor ribbon" style="right: 6%; bottom: 28%; --rot: -16deg;"></div>
        <div class="decor candy" style="left: 6%; bottom: 10%; --rot: 12deg;"></div>
        <h1>聚会Party小游戏合集</h1>
        <p>欢迎大家来到Melody的生日聚会，希望大家玩的开心 🎂</p>
      </div>

      <div class="games-grid">
        <button class="game-card main" type="button" data-nav="mode">
          <div class="decor star" style="right: 20px; top: 18px; --rot: 10deg;"></div>
          <h2>猜台词</h2>
          <p>看影视片段以及图片，抢答下一句台词。</p>
          <span class="tag">立即开玩</span>
        </button>
        <button class="game-card placeholder" type="button" disabled>
          <h3>你画我猜</h3>
          <p>敬请期待</p>
          <span class="tag">糖霜施工中</span>
        </button>
        <button class="game-card placeholder" type="button" disabled>
          <h3>默契挑战</h3>
          <p>敬请期待</p>
          <span class="tag">派对预告</span>
        </button>
      </div>
    </section>

    <section class="screen" id="mode">
      <div class="panel">
        <h1 class="section-title">选择比赛模式</h1>
        <div class="mode-row">
          <button class="pill-btn selected" type="button" data-mode="single">单人赛</button>
          <button class="pill-btn" type="button" data-mode="team">团体赛</button>
        </div>
        <div class="action-row">
          <button class="primary-btn" type="button" data-nav="setup">下一步</button>
          <button class="ghost-btn" type="button" data-nav="home">返回</button>
        </div>
      </div>
    </section>

    <section class="screen" id="setup">
      <div class="panel">
        <h1 class="section-title" id="setupTitle">创建玩家档案</h1>
        <p class="section-subtitle" id="setupSubtitle">取个好记的名字，挑一个软乎乎的头像。至少添加 2 位玩家即可开始。</p>
        <div class="setup-grid">
          <div>
            <label class="field">
              <span id="nameLabel">玩家名称</span>
              <input id="participantName" maxlength="14" placeholder="例如：Melody">
            </label>
            <div class="avatar-grid" id="avatarGrid"></div>
            <div class="error-message" id="setupError"></div>
            <div class="action-row">
              <button class="primary-btn" type="button" id="addParticipant">添加玩家</button>
              <button class="ghost-btn" type="button" id="startGame">开始游戏</button>
            </div>
          </div>
          <div class="side-panel">
            <h2 id="listTitle">玩家列表</h2>
            <div class="participant-list" id="participantList"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="play">
      <div class="gameplay-grid">
        <aside class="side-panel">
          <h2>计分板</h2>
          <div class="scoreboard" id="scoreboard"></div>
        </aside>

        <section class="media-wrap">
          <div class="media-card">
            <video id="clip" controls playsinline></video>
            <div class="media-footer">
              <div class="question-label">
                <strong id="questionTitle">第 1 题</strong>
                <span id="questionMeta">准备播放提示片段</span>
              </div>
              <div class="score-actions">
                <button class="icon-btn" type="button" id="prevQuestion" title="上一题">‹</button>
                <button class="icon-btn" type="button" id="nextQuestion" title="下一题">›</button>
              </div>
            </div>
          </div>
        </section>

        <aside class="side-panel">
          <h2>主持控制</h2>
          <div class="host-controls">
            <button class="primary-btn" type="button" id="playPrompt">播放题目</button>
            <button class="ghost-btn" type="button" id="revealAnswer">揭晓答案</button>
            <button class="ghost-btn" type="button" id="resetScores">清空分数</button>
          </div>
          <div class="answer-panel">
            <h3 id="answerState">答案未揭晓</h3>
            <p id="answerText">先播放题目片段，大家抢答后再揭晓答案视频。</p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const APP_VERSION = "v1.0.1";
    const UPDATE_THEME = "版本管理规范化 + 首页文案更新 + 实时时间显示 + 单人/团体赛命名逻辑修正 + 头像库扩展 + 代码结构整理";

    const AVATAR_LIBRARY = [
      { id: "strawberry", label: "草莓", emoji: "🍓", color: "#ffd8df" },
      { id: "peach", label: "蜜桃", emoji: "🍑", color: "#ffc09b" },
      { id: "lemon", label: "柠檬", emoji: "🍋", color: "#ffe58d" },
      { id: "candy", label: "糖果", emoji: "🍬", color: "#cfc2ff" },
      { id: "cupcake", label: "纸杯蛋糕", emoji: "🧁", color: "#aee8cc" },
      { id: "dango", label: "团子", emoji: "🍡", color: "#a9dcff" },
      { id: "lollipop", label: "棒棒糖", emoji: "🍭", color: "#ffe1ec" },
      { id: "star", label: "星星", emoji: "🌟", color: "#fff1b5" },
      { id: "cherry", label: "樱桃", emoji: "🍒", color: "#ffc2d1" },
      { id: "grape", label: "葡萄", emoji: "🍇", color: "#d9ccff" },
      { id: "watermelon", label: "西瓜", emoji: "🍉", color: "#baf0cf" },
      { id: "cookie", label: "饼干", emoji: "🍪", color: "#ffd6a8" },
      { id: "donut", label: "甜甜圈", emoji: "🍩", color: "#ffc7df" },
      { id: "icecream", label: "冰淇淋", emoji: "🍦", color: "#d8f2ff" },
      { id: "balloon", label: "气球", emoji: "🎈", color: "#ffd1d1" },
      { id: "gift", label: "礼物", emoji: "🎁", color: "#d5f6e7" },
      { id: "party", label: "派对", emoji: "🥳", color: "#ffe6a6" },
      { id: "cake", label: "蛋糕", emoji: "🎂", color: "#eadcff" }
    ];

    const QUESTIONS = [
      ["xi-hong-shi-shou-fu", 5, "西虹市首富"],
      ["ne-zha", 1, "哪吒"],
      ["xia-luo-te-fan-nao", 12, "夏洛特烦恼"],
      ["tang-tan-2", 1, "唐人街探案2"],
      ["tang-tan", 5, "唐人街探案"],
      ["tang-tan-1900", 1, "唐探1900"],
      ["nian-hui-bu-neng-ting", 2, "年会不能停"],
      ["zhua-wa-wa", 2, "抓娃娃"],
      ["wo-bu-shi-yao-shen", 4, "我不是药神"],
      ["hao-dong-xi", 8, "好东西"],
      ["tao-xue-wei-long", 2, "逃学威龙"],
      ["du-xia", 2, "赌侠"],
      ["kuang-biao", 5, "狂飙"],
      ["tuo-kou-xiu", 1, "脱口秀"]
    ].flatMap(([slug, count, title]) => (
      Array.from({ length: count }, () => ({ slug, title }))
    )).map((item, index) => {
      const id = String(index + 1).padStart(3, "0");
      return {
        id,
        title: item.title,
        prompt: `assets/clips/q${id}_${item.slug}_prompt.mp4`,
        answer: `assets/clips/q${id}_${item.slug}_answer.mp4`
      };
    });

    const state = {
      mode: "single",
      screen: "home",
      selectedAvatarId: AVATAR_LIBRARY[0].id,
      currentQuestion: 0,
      revealed: false,
      players: [],
      teams: []
    };

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

    const elements = {
      screens: $$(".screen"),
      clock: $("#clock"),
      avatarGrid: $("#avatarGrid"),
      participantName: $("#participantName"),
      participantList: $("#participantList"),
      setupTitle: $("#setupTitle"),
      setupSubtitle: $("#setupSubtitle"),
      setupError: $("#setupError"),
      nameLabel: $("#nameLabel"),
      listTitle: $("#listTitle"),
      addParticipant: $("#addParticipant"),
      startGame: $("#startGame"),
      scoreboard: $("#scoreboard"),
      clip: $("#clip"),
      toast: $("#toast"),
      questionTitle: $("#questionTitle"),
      questionMeta: $("#questionMeta"),
      answerState: $("#answerState"),
      answerText: $("#answerText")
    };

    function getActiveParticipants() {
      return state.mode === "single" ? state.players : state.teams;
    }

    function getAvatar(avatarId) {
      return AVATAR_LIBRARY.find((avatar) => avatar.id === avatarId) || AVATAR_LIBRARY[0];
    }

    function formatClockPart(value) {
      return String(value).padStart(2, "0");
    }

    function updateClock() {
      const now = new Date();
      elements.clock.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日，${formatClockPart(now.getHours())}:${formatClockPart(now.getMinutes())}:${formatClockPart(now.getSeconds())}`;
    }

    function switchScreen(screen) {
      state.screen = screen;
      elements.screens.forEach((node) => node.classList.toggle("active", node.id === screen));
      clearValidationError();

      if (screen === "setup") {
        updateModeCopy();
        renderParticipants();
      }

      if (screen === "play") {
        renderScoreboard();
        loadQuestion(false);
      }
    }

    function updateSelectedMode(mode) {
      state.mode = mode;
      state.selectedAvatarId = AVATAR_LIBRARY[0].id;
      $$(".pill-btn").forEach((button) => {
        button.classList.toggle("selected", button.dataset.mode === mode);
      });
      updateModeCopy();
      renderAvatars();
      renderParticipants();
    }

    function updateModeCopy() {
      const isSingle = state.mode === "single";
      elements.setupTitle.textContent = isSingle ? "创建玩家档案" : "创建队伍档案";
      elements.setupSubtitle.textContent = isSingle
        ? "取个好记的名字，挑一个软乎乎的头像。至少添加 2 位玩家即可开始。"
        : "取个好记的队伍名，挑一个软乎乎的头像。至少添加 2 个队伍即可开始。";
      elements.nameLabel.textContent = isSingle ? "玩家名称" : "队伍名称";
      elements.participantName.placeholder = isSingle ? "例如：Melody" : "例如：奶油小队";
      elements.addParticipant.textContent = isSingle ? "添加玩家" : "添加队伍";
      elements.listTitle.textContent = isSingle ? "玩家列表" : "队伍列表";
    }

    function renderAvatars() {
      elements.avatarGrid.innerHTML = AVATAR_LIBRARY.map((avatar) => `
        <button class="avatar-card ${avatar.id === state.selectedAvatarId ? "selected" : ""}" type="button" data-avatar-id="${avatar.id}" aria-label="选择头像 ${avatar.label}">
          <span class="avatar-face" style="background: ${avatar.color}">${avatar.emoji}</span>
        </button>
      `).join("");
    }

    function renderParticipants() {
      const participants = getActiveParticipants();
      const emptyText = state.mode === "single" ? "等待添加玩家" : "等待添加组队";

      if (!participants.length) {
        elements.participantList.innerHTML = `
          <div class="participant-row">
            <span class="participant-info">
              <span class="mini-avatar">✦</span>
              <span class="mini-name">${emptyText}</span>
            </span>
          </div>
        `;
        return;
      }

      elements.participantList.innerHTML = participants.map((participant) => {
        const avatar = getAvatar(participant.avatarId);
        return `
          <div class="participant-row">
            <span class="participant-info">
              <span class="mini-avatar" style="background: ${avatar.color}">${avatar.emoji}</span>
              <span class="mini-name">${participant.name}</span>
            </span>
            <button class="remove-btn" type="button" data-remove-id="${participant.id}" aria-label="移除 ${participant.name}">×</button>
          </div>
        `;
      }).join("");
    }

    function renderScoreboard() {
      const participants = getActiveParticipants();
      elements.scoreboard.innerHTML = participants.map((participant, index) => {
        const avatar = getAvatar(participant.avatarId);
        return `
          <div class="score-row ${index === 0 ? "active" : ""}">
            <span class="participant-info">
              <span class="mini-avatar" style="background: ${avatar.color}">${avatar.emoji}</span>
              <span class="mini-name">${participant.name}</span>
            </span>
            <span class="score-value">${participant.score}</span>
            <span class="score-actions">
              <button class="score-btn" type="button" data-score-id="${participant.id}" data-delta="-1">−</button>
              <button class="score-btn" type="button" data-score-id="${participant.id}" data-delta="1">＋</button>
            </span>
          </div>
        `;
      }).join("");
    }

    function showValidationError(message) {
      elements.setupError.textContent = message;
      elements.setupError.classList.add("show");
      showToast(message);
    }

    function clearValidationError() {
      elements.setupError.textContent = "";
      elements.setupError.classList.remove("show");
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => elements.toast.classList.remove("show"), 1800);
    }

    function createParticipant() {
      const name = elements.participantName.value.trim();
      const noun = state.mode === "single" ? "玩家" : "队伍";

      if (!name) {
        showValidationError(`请填写${noun}名称哟`);
        elements.participantName.focus();
        return;
      }

      const participant = {
        id: `${state.mode}-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        name,
        avatarId: state.selectedAvatarId,
        score: 0
      };

      if (state.mode === "single") {
        state.players.push(participant);
      } else {
        state.teams.push(participant);
      }

      elements.participantName.value = "";
      clearValidationError();
      renderParticipants();
      showToast(`${noun}已加入`);
    }

    function removeParticipant(id) {
      if (state.mode === "single") {
        state.players = state.players.filter((player) => player.id !== id);
      } else {
        state.teams = state.teams.filter((team) => team.id !== id);
      }
      renderParticipants();
    }

    function validateStart() {
      if (state.mode === "single" && state.players.length < 2) {
        showValidationError("请至少添加2位玩家哟");
        return false;
      }

      if (state.mode === "team" && state.teams.length < 2) {
        showValidationError("请至少添加2个队伍哟");
        return false;
      }

      return true;
    }

    function adjustScore(id, delta) {
      const participant = getActiveParticipants().find((item) => item.id === id);
      if (!participant) return;
      participant.score = Math.max(0, participant.score + delta);
      renderScoreboard();
    }

    function loadQuestion(reveal) {
      const question = QUESTIONS[state.currentQuestion];
      state.revealed = reveal;
      elements.clip.src = reveal ? question.answer : question.prompt;
      elements.questionTitle.textContent = `第 ${state.currentQuestion + 1} 题 · ${question.title}`;
      elements.questionMeta.textContent = reveal ? "答案片段正在播放" : "题目片段正在播放";
      elements.answerState.textContent = reveal ? "答案已揭晓" : "答案未揭晓";
      elements.answerText.textContent = reveal
        ? `本题来自《${question.title}》。可以给答对的${state.mode === "single" ? "玩家" : "队伍"}加分啦。`
        : "先播放题目片段，大家抢答后再揭晓答案视频。";
      elements.clip.load();
    }

    function resetScores() {
      state.players.forEach((player) => {
        player.score = 0;
      });
      state.teams.forEach((team) => {
        team.score = 0;
      });
      renderScoreboard();
      showToast("分数已清空");
    }

    function goToPreviousQuestion() {
      state.currentQuestion = (state.currentQuestion - 1 + QUESTIONS.length) % QUESTIONS.length;
      loadQuestion(false);
    }

    function goToNextQuestion() {
      state.currentQuestion = (state.currentQuestion + 1) % QUESTIONS.length;
      loadQuestion(false);
    }

    function bindEvents() {
      document.addEventListener("click", (event) => {
        const navTarget = event.target.closest("[data-nav]");
        if (navTarget) switchScreen(navTarget.dataset.nav);

        const modeTarget = event.target.closest("[data-mode]");
        if (modeTarget) updateSelectedMode(modeTarget.dataset.mode);

        const avatarTarget = event.target.closest("[data-avatar-id]");
        if (avatarTarget) {
          state.selectedAvatarId = avatarTarget.dataset.avatarId;
          renderAvatars();
        }

        const removeTarget = event.target.closest("[data-remove-id]");
        if (removeTarget) removeParticipant(removeTarget.dataset.removeId);

        const scoreTarget = event.target.closest("[data-score-id]");
        if (scoreTarget) adjustScore(scoreTarget.dataset.scoreId, Number(scoreTarget.dataset.delta));
      });

      elements.addParticipant.addEventListener("click", createParticipant);
      elements.participantName.addEventListener("keydown", (event) => {
        if (event.key === "Enter") createParticipant();
      });
      elements.startGame.addEventListener("click", () => {
        if (validateStart()) switchScreen("play");
      });
      $("#playPrompt").addEventListener("click", () => loadQuestion(false));
      $("#revealAnswer").addEventListener("click", () => loadQuestion(true));
      $("#resetScores").addEventListener("click", resetScores);
      $("#prevQuestion").addEventListener("click", goToPreviousQuestion);
      $("#nextQuestion").addEventListener("click", goToNextQuestion);
    }

    function init() {
      updateClock();
      window.setInterval(updateClock, 1000);
      updateModeCopy();
      renderAvatars();
      renderParticipants();
      bindEvents();
    }

    init();
  </script>
</body>
</html>
