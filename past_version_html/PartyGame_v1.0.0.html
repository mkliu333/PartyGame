<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聚会Party小游戏合集</title>
  <style>
    :root {
      --cream: #fff8ea;
      --cream-2: #fff1d8;
      --milk: #fffdf8;
      --ink: #594253;
      --muted: #8d7684;
      --pink: #ff9fb9;
      --blush: #ffd8df;
      --peach: #ffc09b;
      --butter: #ffe58d;
      --mint: #aee8cc;
      --sky: #a9dcff;
      --lavender: #cfc2ff;
      --rose: #ff719d;
      --shadow: 0 18px 42px rgba(130, 91, 82, 0.16);
      --shadow-soft: 0 10px 24px rgba(130, 91, 82, 0.11);
      --ring: 0 0 0 4px rgba(255, 159, 185, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 229, 141, 0.72) 0 90px, transparent 92px),
        radial-gradient(circle at 90% 8%, rgba(207, 194, 255, 0.56) 0 120px, transparent 122px),
        radial-gradient(circle at 80% 90%, rgba(174, 232, 204, 0.52) 0 140px, transparent 142px),
        linear-gradient(135deg, #fff8ea 0%, #fff1f4 47%, #f3fbff 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255, 159, 185, 0.33) 0 2px, transparent 2.5px),
        radial-gradient(circle, rgba(169, 220, 255, 0.3) 0 2px, transparent 2.5px);
      background-position: 20px 30px, 95px 110px;
      background-size: 150px 150px, 180px 180px;
      opacity: 0.8;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none !important;
      box-shadow: none !important;
    }

    .app {
      position: relative;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--pink), var(--butter));
      box-shadow: var(--shadow-soft);
    }

    .ghost-btn,
    .primary-btn,
    .pill-btn,
    .score-btn,
    .icon-btn {
      border-radius: 999px;
      color: var(--ink);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .ghost-btn {
      padding: 11px 18px;
      border: 2px solid rgba(255, 159, 185, 0.38);
      background: rgba(255, 253, 248, 0.76);
      box-shadow: var(--shadow-soft);
    }

    .primary-btn {
      min-height: 52px;
      padding: 14px 24px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--rose), var(--peach) 56%, var(--butter));
      box-shadow: 0 12px 26px rgba(255, 113, 157, 0.26);
    }

    .ghost-btn:hover,
    .primary-btn:hover,
    .pill-btn:hover,
    .score-btn:hover,
    .icon-btn:hover,
    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .ghost-btn:focus-visible,
    .primary-btn:focus-visible,
    .pill-btn:focus-visible,
    .score-btn:focus-visible,
    .icon-btn:focus-visible,
    .game-card:focus-visible,
    input:focus-visible {
      outline: none;
      box-shadow: var(--shadow), var(--ring);
    }

    .screen {
      display: none;
      animation: popIn 280ms ease both;
    }

    .screen.active {
      display: block;
    }

    .hero-card {
      position: relative;
      min-height: 310px;
      padding: clamp(28px, 5vw, 58px);
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.88);
      border-radius: 36px;
      background:
        linear-gradient(135deg, rgba(255, 253, 248, 0.94), rgba(255, 241, 216, 0.9)),
        radial-gradient(circle at 88% 26%, rgba(169, 220, 255, 0.46), transparent 30%);
      box-shadow: var(--shadow);
    }

    .hero-card h1 {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0;
      font-size: clamp(40px, 7vw, 76px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .hero-card p {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.7;
    }

    .decor {
      position: absolute;
      z-index: 0;
      display: grid;
      place-items: center;
      user-select: none;
      animation: floaty 4s ease-in-out infinite;
    }

    .star {
      width: 34px;
      height: 34px;
      background: var(--butter);
      clip-path: polygon(50% 0, 61% 34%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 34%);
      filter: drop-shadow(0 6px 8px rgba(245, 181, 69, 0.18));
    }

    .sparkle {
      color: var(--rose);
      font-size: 28px;
      font-weight: 900;
    }

    .ribbon {
      width: 74px;
      height: 26px;
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, var(--pink) 0 14px, var(--milk) 14px 26px);
      box-shadow: var(--shadow-soft);
      transform: rotate(-16deg);
    }

    .candy {
      width: 62px;
      height: 34px;
      border: 3px solid #fff;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--mint), var(--sky));
      box-shadow: var(--shadow-soft);
      transform: rotate(12deg);
    }

    .games-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1.5fr) repeat(2, minmax(190px, 0.85fr));
      gap: 18px;
      margin-top: 22px;
    }

    .game-card {
      position: relative;
      min-height: 176px;
      padding: 24px;
      overflow: hidden;
      text-align: left;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 253, 248, 0.86);
      box-shadow: var(--shadow-soft);
      transition: transform 170ms ease, box-shadow 170ms ease;
    }

    .game-card.main {
      min-height: 230px;
      background:
        radial-gradient(circle at 88% 10%, rgba(255, 229, 141, 0.72), transparent 28%),
        linear-gradient(135deg, #fffdf8, #ffe5ed 58%, #e7f7ff);
    }

    .game-card h2,
    .game-card h3 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }

    .game-card h3 {
      font-size: 22px;
    }

    .game-card p {
      position: relative;
      z-index: 1;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .tag {
      position: relative;
      z-index: 1;
      display: inline-flex;
      margin-top: 18px;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      background: var(--butter);
      box-shadow: 0 8px 16px rgba(245, 181, 69, 0.18);
    }

    .placeholder {
      opacity: 0.8;
      cursor: default;
    }

    .panel {
      padding: clamp(20px, 3.5vw, 34px);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      background: rgba(255, 253, 248, 0.88);
      box-shadow: var(--shadow);
    }

    .section-title {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 48px);
      letter-spacing: 0;
    }

    .section-subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.65;
    }

    .mode-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .pill-btn {
      min-height: 120px;
      padding: 20px;
      border: 3px solid transparent;
      background: linear-gradient(135deg, #fffdf8, #fff2dc);
      box-shadow: var(--shadow-soft);
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 900;
    }

    .pill-btn.selected,
    .avatar-card.selected,
    .team-chip.active {
      border-color: var(--rose);
      background: linear-gradient(135deg, #fffdf8, #ffe1ec);
      box-shadow: var(--shadow), var(--ring);
    }

    .setup-grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 22px;
      align-items: start;
    }

    .field {
      display: grid;
      gap: 9px;
      margin-bottom: 18px;
      font-weight: 900;
    }

    .field input {
      width: 100%;
      min-height: 54px;
      padding: 0 18px;
      border: 3px solid #ffe1c8;
      border-radius: 18px;
      color: var(--ink);
      background: #fffdf8;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.8);
    }

    .team-chips {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .team-chip {
      min-height: 46px;
      border: 2px solid #ffe1c8;
      border-radius: 999px;
      background: #fffdf8;
      color: var(--ink);
      font-weight: 900;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .avatar-card {
      display: grid;
      min-height: 100px;
      place-items: center;
      border: 3px solid transparent;
      border-radius: 24px;
      background: linear-gradient(135deg, #fffdf8, #f2fbff);
      box-shadow: var(--shadow-soft);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .avatar-card:hover {
      transform: translateY(-3px) rotate(-1deg);
      box-shadow: var(--shadow);
    }

    .avatar-face {
      display: grid;
      width: 66px;
      height: 66px;
      place-items: center;
      border-radius: 50%;
      background: var(--blush);
      box-shadow: inset 0 -5px 0 rgba(255, 113, 157, 0.13), 0 8px 14px rgba(130, 91, 82, 0.11);
      font-size: 31px;
    }

    .player-list,
    .scoreboard {
      display: grid;
      gap: 10px;
    }

    .player-row,
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      padding: 9px 12px;
      border-radius: 18px;
      background: rgba(255, 248, 234, 0.76);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-weight: 900;
    }

    .mini-avatar {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 50%;
      background: #ffe1ec;
    }

    .mini-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffe1ec;
      color: var(--rose);
      font-weight: 900;
    }

    .gameplay-grid {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 290px;
      gap: 18px;
      align-items: start;
    }

    .side-panel {
      padding: 18px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      background: rgba(255, 253, 248, 0.9);
      box-shadow: var(--shadow-soft);
    }

    .side-panel h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .score-row.active {
      background: linear-gradient(135deg, #fff3b8, #ffe1ec);
      box-shadow: var(--ring);
    }

    .score-value {
      font-size: 22px;
      font-weight: 900;
    }

    .score-actions {
      display: flex;
      gap: 6px;
    }

    .score-btn,
    .icon-btn {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      background: #fff1d8;
      color: var(--ink);
      font-weight: 900;
    }

    .media-card {
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.92);
      border-radius: 34px;
      background: #2d2530;
      box-shadow: var(--shadow);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #2d2530;
    }

    .media-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #fffdf8, #fff1d8);
    }

    .question-label {
      min-width: 0;
      font-weight: 900;
    }

    .question-label span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .host-controls {
      display: grid;
      gap: 10px;
    }

    .answer-panel {
      margin-top: 12px;
      padding: 16px;
      border: 2px dashed rgba(255, 113, 157, 0.42);
      border-radius: 24px;
      background: #fff8ea;
    }

    .answer-panel h3 {
      margin: 0 0 8px;
    }

    .answer-panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 5;
      max-width: min(360px, calc(100% - 44px));
      padding: 13px 16px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      background: #fffdf8;
      box-shadow: var(--shadow);
      transform: translateY(24px);
      opacity: 0;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @keyframes popIn {
      from {
        transform: translateY(10px) scale(0.99);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes floaty {
      0%, 100% {
        transform: translateY(0) rotate(var(--rot, 0deg));
      }
      50% {
        transform: translateY(-10px) rotate(var(--rot, 0deg));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }

    @media (max-width: 980px) {
      .games-grid,
      .setup-grid,
      .gameplay-grid {
        grid-template-columns: 1fr;
      }

      .gameplay-grid .side-panel:first-child {
        order: 2;
      }

      .gameplay-grid .media-wrap {
        order: 1;
      }

      .gameplay-grid .side-panel:last-child {
        order: 3;
      }
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 20px, 1180px);
        padding-top: 14px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero-card {
        border-radius: 28px;
      }

      .mode-row,
      .team-chips {
        grid-template-columns: 1fr;
      }

      .avatar-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .media-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="topbar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <span>Party Game</span>
      </div>
      <button class="ghost-btn" type="button" data-nav="home">回到首页</button>
    </nav>

    <section class="screen active" id="home">
      <div class="hero-card">
        <div class="decor star" style="right: 12%; top: 18%; --rot: 14deg;"></div>
        <div class="decor sparkle" style="right: 28%; bottom: 16%; --rot: -8deg;">✧</div>
        <div class="decor ribbon" style="right: 6%; bottom: 28%; --rot: -16deg;"></div>
        <div class="decor candy" style="left: 6%; bottom: 10%; --rot: 12deg;"></div>
        <h1>聚会Party小游戏合集</h1>
        <p>甜甜的暖场、清楚的主持流程、轻松计分。选一个小游戏，大家马上进入快乐频道。</p>
      </div>

      <div class="games-grid">
        <button class="game-card main" type="button" data-nav="mode">
          <div class="decor star" style="right: 20px; top: 18px; --rot: 10deg;"></div>
          <h2>猜台词</h2>
          <p>看电影片段，抢答下一句台词。适合朋友局、家庭局、年会局。</p>
          <span class="tag">立即开玩</span>
        </button>
        <button class="game-card placeholder" type="button" disabled>
          <h3>你画我猜</h3>
          <p>敬请期待</p>
          <span class="tag">糖霜施工中</span>
        </button>
        <button class="game-card placeholder" type="button" disabled>
          <h3>默契挑战</h3>
          <p>敬请期待</p>
          <span class="tag">派对预告</span>
        </button>
      </div>
    </section>

    <section class="screen" id="mode">
      <div class="panel">
        <h1 class="section-title">选择比赛模式</h1>
        <p class="section-subtitle">大按钮负责大决定。单人赛适合快速抢答，团体赛适合热闹分组。</p>
        <div class="mode-row">
          <button class="pill-btn selected" type="button" data-mode="single">单人赛</button>
          <button class="pill-btn" type="button" data-mode="team">团体赛</button>
        </div>
        <div class="action-row">
          <button class="primary-btn" type="button" data-nav="setup">下一步</button>
          <button class="ghost-btn" type="button" data-nav="home">返回</button>
        </div>
      </div>
    </section>

    <section class="screen" id="setup">
      <div class="panel">
        <h1 class="section-title">创建玩家档案</h1>
        <p class="section-subtitle">取个好记的名字，挑一个软乎乎的头像。至少添加 1 位玩家即可开始。</p>
        <div class="setup-grid">
          <div>
            <label class="field">
              玩家名称
              <input id="playerName" maxlength="14" placeholder="例如：小王">
            </label>
            <div class="team-chips" id="teamPicker">
              <button class="team-chip active" type="button" data-team="蜜桃队">蜜桃队</button>
              <button class="team-chip" type="button" data-team="薄荷队">薄荷队</button>
            </div>
            <div class="avatar-grid" id="avatarGrid"></div>
            <div class="action-row">
              <button class="primary-btn" type="button" id="addPlayer">添加玩家</button>
              <button class="ghost-btn" type="button" id="startGame">开始游戏</button>
            </div>
          </div>
          <div class="side-panel">
            <h2>玩家列表</h2>
            <div class="player-list" id="playerList"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="play">
      <div class="gameplay-grid">
        <aside class="side-panel">
          <h2>计分板</h2>
          <div class="scoreboard" id="scoreboard"></div>
        </aside>

        <section class="media-wrap">
          <div class="media-card">
            <video id="clip" controls playsinline></video>
            <div class="media-footer">
              <div class="question-label">
                <strong id="questionTitle">第 1 题</strong>
                <span id="questionMeta">准备播放提示片段</span>
              </div>
              <div class="score-actions">
                <button class="icon-btn" type="button" id="prevQuestion" title="上一题">‹</button>
                <button class="icon-btn" type="button" id="nextQuestion" title="下一题">›</button>
              </div>
            </div>
          </div>
        </section>

        <aside class="side-panel">
          <h2>主持控制</h2>
          <div class="host-controls">
            <button class="primary-btn" type="button" id="playPrompt">播放题目</button>
            <button class="ghost-btn" type="button" id="revealAnswer">揭晓答案</button>
            <button class="ghost-btn" type="button" id="resetScores">清空分数</button>
          </div>
          <div class="answer-panel">
            <h3 id="answerState">答案未揭晓</h3>
            <p id="answerText">先播放题目片段，大家抢答后再揭晓答案视频。</p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const state = {
      screen: "home",
      mode: "single",
      selectedAvatar: 0,
      selectedTeam: "蜜桃队",
      currentQuestion: 0,
      revealed: false,
      teamScores: { "蜜桃队": 0, "薄荷队": 0 },
      players: []
    };

    const avatars = ["🍓", "🍑", "🍋", "🍬", "🧁", "🍡", "🍭", "🌟"];
    const avatarColors = ["#ffd8df", "#ffc09b", "#ffe58d", "#cfc2ff", "#aee8cc", "#a9dcff", "#ffe1ec", "#fff1b5"];
    const slugMap = [
      ["xi-hong-shi-shou-fu", 5, "西虹市首富"],
      ["ne-zha", 1, "哪吒"],
      ["xia-luo-te-fan-nao", 12, "夏洛特烦恼"],
      ["tang-tan-2", 1, "唐人街探案2"],
      ["tang-tan", 5, "唐人街探案"],
      ["tang-tan-1900", 1, "唐探1900"],
      ["nian-hui-bu-neng-ting", 2, "年会不能停"],
      ["zhua-wa-wa", 2, "抓娃娃"],
      ["wo-bu-shi-yao-shen", 4, "我不是药神"],
      ["hao-dong-xi", 8, "好东西"],
      ["tao-xue-wei-long", 2, "逃学威龙"],
      ["du-xia", 2, "赌侠"],
      ["kuang-biao", 5, "狂飙"],
      ["tuo-kou-xiu", 1, "脱口秀"]
    ];

    const questions = slugMap.flatMap((group) => {
      const [slug, count, title] = group;
      return Array.from({ length: count }, () => ({ slug, title }));
    }).map((item, index) => {
      const id = String(index + 1).padStart(3, "0");
      return {
        id,
        title: item.title,
        prompt: `assets/clips/q${id}_${item.slug}_prompt.mp4`,
        answer: `assets/clips/q${id}_${item.slug}_answer.mp4`
      };
    });

    const screens = [...document.querySelectorAll(".screen")];
    const clip = document.querySelector("#clip");
    const toast = document.querySelector("#toast");

    function nav(screen) {
      state.screen = screen;
      screens.forEach((node) => node.classList.toggle("active", node.id === screen));
      if (screen === "play") {
        renderScoreboard();
        loadQuestion(false);
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function renderAvatars() {
      const grid = document.querySelector("#avatarGrid");
      grid.innerHTML = avatars.map((avatar, index) => `
        <button class="avatar-card ${index === state.selectedAvatar ? "selected" : ""}" type="button" data-avatar="${index}" aria-label="选择头像 ${avatar}">
          <span class="avatar-face" style="background: ${avatarColors[index]}">${avatar}</span>
        </button>
      `).join("");
    }

    function renderPlayers() {
      const list = document.querySelector("#playerList");
      if (!state.players.length) {
        list.innerHTML = `<div class="player-row"><span class="player-info"><span class="mini-avatar">✦</span><span class="mini-name">等待添加玩家</span></span></div>`;
        return;
      }

      list.innerHTML = state.players.map((player, index) => `
        <div class="player-row">
          <span class="player-info">
            <span class="mini-avatar" style="background: ${avatarColors[player.avatar]}">${avatars[player.avatar]}</span>
            <span class="mini-name">${player.name}${state.mode === "team" ? ` · ${player.team}` : ""}</span>
          </span>
          <button class="remove-btn" type="button" data-remove="${index}" aria-label="移除 ${player.name}">×</button>
        </div>
      `).join("");
    }

    function addPlayer() {
      const input = document.querySelector("#playerName");
      const name = input.value.trim();
      if (!name) {
        showToast("先给玩家起个名字吧");
        input.focus();
        return;
      }

      state.players.push({
        name,
        avatar: state.selectedAvatar,
        team: state.selectedTeam,
        score: 0
      });
      input.value = "";
      renderPlayers();
      showToast("玩家已加入");
    }

    function activeScorers() {
      if (state.mode === "single") {
        return state.players;
      }

      const teams = new Map();
      state.players.forEach((player) => {
        if (!teams.has(player.team)) {
          teams.set(player.team, {
            name: player.team,
            avatar: player.team === "蜜桃队" ? 1 : 6,
            score: state.teamScores[player.team] || 0,
            teamScore: true
          });
        }
      });
      return [...teams.values()];
    }

    function renderScoreboard() {
      const board = document.querySelector("#scoreboard");
      const scorers = activeScorers();
      board.innerHTML = scorers.map((player, index) => `
        <div class="score-row ${index === 0 ? "active" : ""}">
          <span class="player-info">
            <span class="mini-avatar" style="background: ${avatarColors[player.avatar] || "#ffe1ec"}">${avatars[player.avatar] || "✦"}</span>
            <span class="mini-name">${player.name}</span>
          </span>
          <span class="score-value">${player.score}</span>
          <span class="score-actions">
            <button class="score-btn" type="button" data-score="${player.name}" data-delta="-1">−</button>
            <button class="score-btn" type="button" data-score="${player.name}" data-delta="1">＋</button>
          </span>
        </div>
      `).join("");
    }

    function adjustScore(name, delta) {
      if (state.mode === "single") {
        const player = state.players.find((item) => item.name === name);
        if (player) player.score = Math.max(0, player.score + delta);
      } else {
        state.teamScores[name] = Math.max(0, (state.teamScores[name] || 0) + delta);
      }
      renderScoreboard();
    }

    function loadQuestion(reveal) {
      const question = questions[state.currentQuestion];
      state.revealed = reveal;
      clip.src = reveal ? question.answer : question.prompt;
      document.querySelector("#questionTitle").textContent = `第 ${state.currentQuestion + 1} 题 · ${question.title}`;
      document.querySelector("#questionMeta").textContent = reveal ? "答案片段正在播放" : "题目片段正在播放";
      document.querySelector("#answerState").textContent = reveal ? "答案已揭晓" : "答案未揭晓";
      document.querySelector("#answerText").textContent = reveal
        ? `本题来自《${question.title}》。可以给答对的玩家加分啦。`
        : "先播放题目片段，大家抢答后再揭晓答案视频。";
      clip.load();
    }

    document.addEventListener("click", (event) => {
      const navTarget = event.target.closest("[data-nav]");
      if (navTarget) nav(navTarget.dataset.nav);

      const modeTarget = event.target.closest("[data-mode]");
      if (modeTarget) {
        state.mode = modeTarget.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach((button) => button.classList.toggle("selected", button === modeTarget));
        document.querySelector("#teamPicker").style.display = state.mode === "team" ? "grid" : "none";
        renderPlayers();
      }

      const avatarTarget = event.target.closest("[data-avatar]");
      if (avatarTarget) {
        state.selectedAvatar = Number(avatarTarget.dataset.avatar);
        renderAvatars();
      }

      const teamTarget = event.target.closest("[data-team]");
      if (teamTarget) {
        state.selectedTeam = teamTarget.dataset.team;
        document.querySelectorAll("[data-team]").forEach((button) => button.classList.toggle("active", button === teamTarget));
      }

      const removeTarget = event.target.closest("[data-remove]");
      if (removeTarget) {
        state.players.splice(Number(removeTarget.dataset.remove), 1);
        renderPlayers();
      }

      const scoreTarget = event.target.closest("[data-score]");
      if (scoreTarget) adjustScore(scoreTarget.dataset.score, Number(scoreTarget.dataset.delta));
    });

    document.querySelector("#addPlayer").addEventListener("click", addPlayer);
    document.querySelector("#playerName").addEventListener("keydown", (event) => {
      if (event.key === "Enter") addPlayer();
    });
    document.querySelector("#startGame").addEventListener("click", () => {
      if (!state.players.length) {
        showToast("至少添加 1 位玩家再开始");
        return;
      }
      nav("play");
    });
    document.querySelector("#playPrompt").addEventListener("click", () => loadQuestion(false));
    document.querySelector("#revealAnswer").addEventListener("click", () => loadQuestion(true));
    document.querySelector("#resetScores").addEventListener("click", () => {
      state.players.forEach((player) => player.score = 0);
      state.teamScores = { "蜜桃队": 0, "薄荷队": 0 };
      renderScoreboard();
      showToast("分数已清空");
    });
    document.querySelector("#prevQuestion").addEventListener("click", () => {
      state.currentQuestion = (state.currentQuestion - 1 + questions.length) % questions.length;
      loadQuestion(false);
    });
    document.querySelector("#nextQuestion").addEventListener("click", () => {
      state.currentQuestion = (state.currentQuestion + 1) % questions.length;
      loadQuestion(false);
    });

    renderAvatars();
    renderPlayers();
    document.querySelector("#teamPicker").style.display = "none";
  </script>
</body>
</html>
